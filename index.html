<!DOCTYPE html>
<html lang="en">
<head>

<title>Duplicate Image Search</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png"/>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" type="text/css" href="css/fonts.css">
<link rel="stylesheet" type="text/css" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.js"></script>
<script src="https://unpkg.com/vuex@4.0.0/dist/vuex.global.js"></script>
<script src="src/scripts/ahash.js"></script>
<script src="src/scripts/dhash.js"></script>
<script src="src/scripts/path-sort.js"></script>
<script src="src/scripts/unified-file-provider.js"></script>
<script src="src/scripts/search.js"></script>
<script src="src/scripts/signal.js"></script>
<script src="src/scripts/image-file.js"></script>
<script src="src/plugins/persistence.js"></script>
<script src="src/components/Cluster.js"></script>
<script src="src/components/Thumbnail.js"></script>
<script src="src/components/ScrollToTop.js"></script>
<script src="src/views/SetupPage.js"></script>
<script src="src/views/ResultsPage.js"></script>
<script src="src/config.js"></script>
<script src="src/state.js"></script>
<script src="src/App.js"></script>
<script src="src/main.js"></script>
</head>

<body id="app-main">

	<script>
	   const App = {

			template: `
		<SetupPage   ref="setupPage"   v-show="page === 'setup'"></SetupPage>
		<ResultsPage ref="resultsPage" v-show="page !== 'setup'"></ResultsPage>
		`,

			data() {
				return {
					page : "setup",
				}
			},

			mounted() {
				this.$refs.setupPage.$el.focus();
			},

			computed: {
				searchStatus() {
					return this.$store.state.searchStatus;
				}
			},

			watch: {
				searchStatus(oldVal, newVal) {
					if (newVal === "search_ready") {
						this.page = "setup";
						this.$refs.setupPage.$el.focus();
					} else {
						this.page = "results";
						this.$refs.resultsPage.$el.focus();
					}
				}
			}
		}

		const app = Vue.createApp(App);

		app.component("SetupPage", SetupPage);
		app.component("ResultsPage", ResultsPage);
		app.component("Cluster", Cluster);
		app.component("Thumbnail", Thumbnail);
		app.component("ScrollToTop", ScrollToTop);

		const { createStore } = Vuex;
		const store = createStore(State);

		app.use(store);

		document.addEventListener("DOMContentLoaded", () => {
			app.mount("#app-main");
		});
	</script>
</body>

</html>
